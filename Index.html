<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>⚡ Athlete Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080e1a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:60px}
button,input,select{font-family:inherit}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5);cursor:pointer}
select option{background:#1e293b}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0f172a}
::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:16px;margin-bottom:12px}
.card-title{font-size:10px;font-weight:700;letter-spacing:.15em;color:#64748b;text-transform:uppercase;margin-bottom:12px}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:72px}
.lbl{font-size:9px;font-weight:700;color:#64748b;letter-spacing:.1em;text-transform:uppercase}
.inp{background:#1e293b;border:1px solid #334155;border-radius:8px;color:#f1f5f9;padding:9px 10px;font-size:14px;outline:none;width:100%}
.inp:focus{border-color:#475569}
.btn{border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;align-self:flex-end;flex-shrink:0}
.btn-green{background:#a3e635;color:#0f172a}
.btn-blue{background:#38bdf8;color:#0f172a}
.btn-purple{background:#c084fc;color:#0f172a}
.chip{padding:5px 11px;font-size:11px;font-weight:700;border-radius:20px;cursor:pointer;border:1px solid #1e293b;background:#0f172a;color:#475569;white-space:nowrap;transition:all .15s}
.chip.active{border:none;color:#0f172a}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.del-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
.del-btn:hover{color:#f87171}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:7px 8px;font-size:9px;font-weight:700;color:#64748b;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #1e293b}
.tbl td{padding:8px 8px;border-bottom:1px solid #0f1825;color:#cbd5e1}
.empty{text-align:center;padding:28px 0;color:#334155;font-size:13px}
.flash{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#a3e635;color:#0f172a;font-weight:800;font-size:13px;padding:9px 22px;border-radius:24px;letter-spacing:.05em;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s}
.flash.show{opacity:1}
.tip-box{padding:10px 12px;background:#080e1a;border-radius:8px;margin-bottom:12px;font-size:11px;color:#94a3b8;line-height:1.6}
.food-card{background:#080e1a;border:1px solid #1e293b;border-radius:10px;padding:14px;margin-bottom:8px}
.macro-pill{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:3px 9px;margin-right:5px;margin-bottom:5px}
.macro-bar-wrap{margin-bottom:14px}
.macro-bar-track{height:8px;background:#1e293b;border-radius:4px;overflow:hidden}
.macro-bar-fill{height:100%;border-radius:4px;transition:width .4s}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:14px}
.stat-card{background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:10px}
.tab-bar{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:2px solid #1e293b;background:#0f172a;position:sticky;top:0;z-index:50}
.tab-btn{padding:14px 4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border:none;background:transparent;color:#475569;border-bottom:3px solid transparent;text-align:center;width:100%;margin-bottom:-2px;transition:color .15s}
.tab-btn.active{color:#f1f5f9;border-bottom-color:#a3e635}
.tab-content{padding:14px 14px 0}
.target-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.legend{display:flex;gap:14px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:#64748b}
.legend-dot{width:10px;height:10px;border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <div id="header"></div>
  <div class="tab-bar" id="tab-bar"></div>
  <div class="tab-content" id="tab-content"></div>
</div>
<div class="flash" id="flash"></div>

<script>

    {name:"Rice Cakes + Greek Yogurt",portion:"3 rice cakes + 200g 0% yogurt",p:21,c:29,f:0,kcal:200,note:"Light, easy to digest. Perfect 1 hr before."},
    {name:"Banana + Protein Shake",portion:"1 banana + 1 scoop whey in water",p:28,c:32,f:2,kcal:258,note:"Fastest option when short on time."},

// ── STATE ─────────────────────────────────────────────────────────────────────
let S = {
  tab:"bodyweight", selEx:EXERCISES[0], selMeal:"breakfast",
  bwData:[], liftData:{}, macData:[],
  bwDate:TODAY, bwVal:"",
  liftDate:TODAY, liftKg:"", liftSets:"", liftReps:"",
  macDate:TODAY, macP:"", macC:"", macF:"",
};

// ── STORAGE ───────────────────────────────────────────────────────────────────
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=(k)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};

// ── UTILS ─────────────────────────────────────────────────────────────────────
const fmtDate=d=>new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

let flashTimer=null;
function showFlash(msg){
  const el=document.getElementById("flash");
  el.textContent=msg; el.classList.add("show");
  if(flashTimer) clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>el.classList.remove("show"),2000);
}

// ── SVG CHARTS ────────────────────────────────────────────────────────────────
function lineAreaChart(data, opts={}) {
  if(!data||data.length<2) return `<div class="empty">Add at least 2 entries to see your chart</div>`;
  const W=360,H=175,P={t:14,r:12,b:32,l:42};
  const pw=W-P.l-P.r, ph=H-P.t-P.b;
  const vals=data.map(d=>d.y);
  const rawMin=Math.min(...vals), rawMax=Math.max(...vals);
  const pad=(rawMax-rawMin)*0.15||1;
  const yMin=opts.yMin!==undefined?opts.yMin:rawMin-pad;
  const yMax=opts.yMax!==undefined?opts.yMax:rawMax+pad;
  const yr=yMax-yMin||1;
  const sx=i=>P.l+(i/(data.length-1))*pw;
  const sy=v=>P.t+ph*(1-(v-yMin)/yr);
  const pts=data.map((d,i)=>({x:sx(i),y:sy(d.y),lbl:d.x,val:d.y}));
  const lp=pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const ap=`${lp} L${pts[pts.length-1].x.toFixed(1)},${(P.t+ph).toFixed(1)} L${P.l},${(P.t+ph).toFixed(1)} Z`;
  const col=opts.color||"#a3e635";
  const gid="g"+Math.random().toString(36).substr(2,6);
  // y ticks
  const nTick=4;
  const yTicks=Array.from({length:nTick+1},(_,i)=>{const v=yMin+(yr/nTick)*i;return{v,y:sy(v)};});
  // x labels
  const step=Math.max(1,Math.ceil(data.length/5));
  const xLbls=pts.filter((_,i)=>i%step===0||i===pts.length-1);
  // ref line
  let ref="";
  if(opts.refY!==undefined){
    const ry=sy(opts.refY);
    ref=`<line x1="${P.l}" y1="${ry.toFixed(1)}" x2="${W-P.r}" y2="${ry.toFixed(1)}" stroke="#f59e0b" stroke-dasharray="5,4" stroke-width="1.5"/>
    <text x="${W-P.r-2}" y="${(ry-5).toFixed(1)}" text-anchor="end" font-size="9" fill="#f59e0b" font-weight="bold">${esc(opts.refLabel||"")}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;overflow:visible">
  <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="5%" stop-color="${col}" stop-opacity="0.3"/>
    <stop offset="95%" stop-color="${col}" stop-opacity="0"/>
  </linearGradient></defs>
  ${yTicks.map(t=>`<line x1="${P.l}" y1="${t.y.toFixed(1)}" x2="${W-P.r}" y2="${t.y.toFixed(1)}" stroke="#1e293b" stroke-width="1"/>
  <text x="${P.l-5}" y="${t.y.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="#475569">${t.v.toFixed(1)}</text>`).join("")}
  ${ref}
  <path d="${ap}" fill="url(#${gid})"/>
  <path d="${lp}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${col}" stroke="#0f172a" stroke-width="2"/>`).join("")}
  ${xLbls.map(p=>`<text x="${p.x.toFixed(1)}" y="${(P.t+ph+17).toFixed(1)}" text-anchor="middle" font-size="9" fill="#475569">${esc(p.lbl)}</text>`).join("")}
  </svg>`;
}

function macroBarChart(data) {
  if(!data||data.length<2) return `<div class="empty">Log at least 2 days to see your macro trend</div>`;
  const W=360,H=190,P={t:14,r:10,b:32,l:38};
  const pw=W-P.l-P.r, ph=H-P.t-P.b;
  const allV=data.flatMap(d=>[d.protein,d.carbs,d.fat]);
  const yMax=Math.ceil(Math.max(...allV)*1.15)||100;
  const sy=v=>P.t+ph*(1-v/yMax);
  const bh=v=>(v/yMax)*ph;
  const gw=pw/data.length;
  const bw=Math.max(5,Math.floor(gw*0.22));
  const nTick=4;
  const yTicks=Array.from({length:nTick+1},(_,i)=>{const v=(yMax/nTick)*i;return{v,y:sy(v)};});
  const bars=data.map((d,i)=>{
    const cx=P.l+i*gw+gw/2;
    const vals=[{v:d.protein,c:"#a3e635"},{v:d.carbs,c:"#38bdf8"},{v:d.fat,c:"#c084fc"}];
    const totalW=bw*3+bw*0.4;
    const startX=cx-totalW/2;
    return vals.map((b,j)=>{
      const x=startX+j*(bw+bw*0.2);
      const h=Math.max(2,bh(b.v));
      const y=sy(b.v);
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" fill="${b.c}" rx="2"/>`;
    }).join("")+`<text x="${cx.toFixed(1)}" y="${(P.t+ph+17).toFixed(1)}" text-anchor="middle" font-size="9" fill="#475569">${esc(d.label)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
  ${yTicks.map(t=>`<line x1="${P.l}" y1="${t.y.toFixed(1)}" x2="${W-P.r}" y2="${t.y.toFixed(1)}" stroke="#1e293b" stroke-width="1"/>
  <text x="${P.l-4}" y="${t.y.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="#475569">${Math.round(t.v)}</text>`).join("")}
  ${bars}
  </svg>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#a3e635"></div>Protein</div>
    <div class="legend-item"><div class="legend-dot" style="background:#38bdf8"></div>Carbs</div>
    <div class="legend-item"><div class="legend-dot" style="background:#c084fc"></div>Fat</div>
  </div>`;
}

// ── COMPONENT HELPERS ─────────────────────────────────────────────────────────
function macroProgressBar(label, value, target, color, unit="g") {
  const pct=Math.min(100,Math.round((value/target)*100));
  const over=value>target;
  const barColor=over?"#f87171":color;
  const statusColor=over?"#f87171":pct>=80?"#34d399":"#f59e0b";
  const statusText=over?"⚠ over":pct>=80?"✓":"";
  return `<div class="macro-bar-wrap">
    <div style="display:flex;justify-content:space-between;margin-bottom:5px">
      <span style="font-size:11px;font-weight:700;color:#64748b;letter-spacing:.1em;text-transform:uppercase">${label}</span>
      <span style="font-size:12px;font-weight:700;color:${over?"#f87171":"#f1f5f9"}">${value}${unit} <span style="color:#475569;font-weight:400">/ ${target}${unit}</span></span>
    </div>
    <div class="macro-bar-track"><div class="macro-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
    <div style="font-size:10px;color:${statusColor};margin-top:3px;text-align:right">${pct}% ${statusText}</div>
  </div>`;
}

// ── RENDER HEADER ─────────────────────────────────────────────────────────────
function renderHeader() {
  const bwData=S.bwData, macData=S.macData;
  const latestBW=bwData.length?bwData[bwData.length-1].weight:null;
  const totalLost=latestBW?(75.3-latestBW).toFixed(1):"0.0";
  const toGo=latestBW?(latestBW<=73?'<span style="color:#34d399">✓ Done</span>':`${(latestBW-73).toFixed(1)} kg`):"2.3 kg";
  const avgProt=macData.length?Math.round(macData.reduce((s,e)=>s+e.protein,0)/macData.length):0;
  const stats=[
    {label:"Current",val:latestBW?`${latestBW} kg`:"—",col:"#a3e635"},
    {label:"Lost",val:parseFloat(totalLost)>0?`−${totalLost} kg`:"—",col:parseFloat(totalLost)>0?"#34d399":"#94a3b8"},
    {label:"To Go",val:toGo,col:latestBW&&latestBW<=73?"#34d399":"#f59e0b"},
    {label:"Avg Prot",val:avgProt?`${avgProt}g`:"—",col:avgProt>=160?"#34d399":avgProt>0?"#f59e0b":"#94a3b8"},
  ];
  document.getElementById("header").innerHTML=`
    <div style="background:linear-gradient(135deg,#0f172a,#1e293b);border-bottom:1px solid #1e293b;padding:20px 14px 16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div style="font-size:10px;font-weight:700;letter-spacing:.2em;color:#a3e635;text-transform:uppercase;margin-bottom:3px">⚡ Athlete Log</div>
          <h1 style="font-size:22px;font-weight:800;color:#f1f5f9;letter-spacing:-.03em;line-height:1.1">Progress Tracker</h1>
        </div>
        <div style="text-align:right">
          <div style="font-size:10px;color:#475569;letter-spacing:.1em">PHASE 1</div>
          <div style="font-size:11px;color:#64748b;margin-top:2px">May 25 – Jun 21</div>
          <div style="margin-top:6px;font-size:9px;font-weight:700;color:#a3e635">TARGET: 73 kg · 2200 kcal</div>
        </div>
      </div>
      <div class="stat-grid">
        ${stats.map(st=>`<div class="stat-card">
          <div style="font-size:8px;color:#64748b;font-weight:700;letter-spacing:.1em;text-transform:uppercase">${st.label}</div>
          <div style="font-size:17px;font-weight:800;color:${st.col};margin-top:2px;line-height:1.1">${st.val}</div>
        </div>`).join("")}
      </div>
    </div>`;
}

// ── RENDER TABS ───────────────────────────────────────────────────────────────
function renderTabs() {
  document.getElementById("tab-bar").innerHTML=[["bodyweight","⚖ Weight"],["lifting","🏋 Lifting"],["nutrition","🥗 Nutrition"]].map(([id,lbl])=>
    `<button class="tab-btn${S.tab===id?" active":""}" data-action="set-tab" data-tab="${id}">${lbl}</button>`
  ).join("");
}

// ── RENDER BODY WEIGHT ────────────────────────────────────────────────────────
function renderBodyWeightTab() {
  const bwData=S.bwData;
  const chartData=bwData.map(e=>({x:fmtDate(e.date),y:e.weight}));
  const bwMin=bwData.length?Math.floor(Math.min(...bwData.map(e=>e.weight),73)-0.5):71.5;
  const bwMax=bwData.length?Math.ceil(Math.max(...bwData.map(e=>e.weight),75.3)+0.5):76.5;
  const chart=lineAreaChart(chartData,{color:"#a3e635",refY:73,refLabel:"73 kg TARGET",yMin:bwMin,yMax:bwMax});
  const rows=bwData.length===0?`<tr><td colspan="4" class="empty">No entries yet — log your first weigh-in above</td></tr>`
    :[...bwData].reverse().map(e=>{
      const diff=(e.weight-75.3).toFixed(1),dn=parseFloat(diff);
      const col=dn<0?"#34d399":dn>0?"#f87171":"#94a3b8";
      const txt=dn<0?`−${Math.abs(diff)}`:dn>0?`+${diff}`:"—";
      return `<tr>
        <td>${fmtDate(e.date)}</td>
        <td style="font-weight:700;color:#f1f5f9">${e.weight} kg</td>
        <td style="color:${col};font-weight:600">${txt} kg</td>
        <td><button class="del-btn" data-action="del-bw" data-date="${e.date}">✕</button></td>
      </tr>`;
    }).join("");
  return `
    <div class="card">
      <div class="card-title">Log Weigh-In</div>
      <div class="form-row">
        <div class="fg"><label class="lbl">Date</label><input class="inp" type="date" id="bw-date" value="${S.bwDate}"></div>
        <div class="fg" style="max-width:120px"><label class="lbl">Weight (kg)</label><input class="inp" type="number" step="0.1" placeholder="75.3" id="bw-val" value="${esc(S.bwVal)}"></div>
        <button class="btn btn-green" data-action="add-bw">+ Add</button>
      </div>
    </div>
    <div class="card"><div class="card-title">Weight Over Time</div>${chart}</div>
    <div class="card">
      <div class="card-title">History</div>
      <table class="tbl"><thead><tr><th>Date</th><th>Weight</th><th>vs Start</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
}

// ── RENDER LIFTING ────────────────────────────────────────────────────────────
function renderLiftingTab() {
  const curLifts=S.liftData[S.selEx]||[];
  const liftPR=curLifts.length?Math.max(...curLifts.map(e=>e.weight)):null;
  const chartData=curLifts.map(e=>({x:fmtDate(e.date),y:e.weight}));
  const liftMin=curLifts.length?Math.max(0,Math.floor(Math.min(...curLifts.map(e=>e.weight))-2)):0;
  const liftMax=curLifts.length?Math.ceil(Math.max(...curLifts.map(e=>e.weight))+5):50;
  const chart=lineAreaChart(chartData,{color:"#38bdf8",yMin:liftMin,yMax:liftMax});
  const rows=curLifts.length===0?`<tr><td colspan="5" class="empty">No entries yet for this exercise</td></tr>`
    :[...curLifts].reverse().map(e=>`<tr>
      <td>${fmtDate(e.date)}</td>
      <td style="font-weight:700;color:${e.weight===liftPR?"#38bdf8":"#f1f5f9"}">${e.weight} kg${e.weight===liftPR&&curLifts.length>1?" 🏆":""}</td>
      <td>${esc(e.sets)}</td>
      <td>${esc(e.reps)}</td>
      <td><button class="del-btn" data-action="del-lift" data-date="${e.date}">✕</button></td>
    </tr>`).join("");
  const prBadge=liftPR?`<div style="background:#0c1a2e;border:1px solid #38bdf8;border-radius:6px;padding:3px 9px;font-size:10px;font-weight:700;color:#38bdf8">PR: ${liftPR} kg</div>`:"";
  return `
    <div class="card">
      <div class="card-title">Select Exercise</div>
      <div class="chips">${EXERCISES.map(ex=>`<button class="chip${S.selEx===ex?" active":""}" style="${S.selEx===ex?"background:#38bdf8":""}" data-action="set-ex" data-ex="${esc(ex)}">${esc(ex)}</button>`).join("")}</div>
    </div>
    <div class="card">
      <div class="card-title">Log Set — ${esc(S.selEx)}</div>
      <div class="form-row">
        <div class="fg"><label class="lbl">Date</label><input class="inp" type="date" id="lift-date" value="${S.liftDate}"></div>
        <div class="fg" style="max-width:100px"><label class="lbl">Weight (kg)</label><input class="inp" type="number" step="0.5" placeholder="20" id="lift-kg" value="${esc(S.liftKg)}"></div>
        <div class="fg" style="max-width:62px"><label class="lbl">Sets</label><input class="inp" type="number" placeholder="4" id="lift-sets" value="${esc(S.liftSets)}"></div>
        <div class="fg" style="max-width:62px"><label class="lbl">Reps</label><input class="inp" type="number" placeholder="10" id="lift-reps" value="${esc(S.liftReps)}"></div>
        <button class="btn btn-blue" data-action="add-lift">+ Add</button>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-title" style="margin:0">${esc(S.selEx)} — Progress</div>${prBadge}
      </div>
      ${chart}
    </div>
    <div class="card">
      <div class="card-title">History — ${esc(S.selEx)}</div>
      <table class="tbl"><thead><tr><th>Date</th><th>Weight</th><th>Sets</th><th>Reps</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
}

// ── RENDER NUTRITION ──────────────────────────────────────────────────────────
function renderNutritionTab() {
  const macData=S.macData;
  const todayMac=macData.find(e=>e.date===TODAY);
  const avgProt=macData.length?Math.round(macData.reduce((s,e)=>s+e.protein,0)/macData.length):0;
  const chartData=macData.slice(-10).map(e=>({label:fmtDate(e.date),protein:e.protein,carbs:e.carbs,fat:e.fat}));
  const macRows=macData.length===0?"":[...macData].reverse().map(e=>`<tr>
    <td>${fmtDate(e.date)}</td>
    <td style="color:${e.protein>=160?"#a3e635":"#f59e0b"};font-weight:600">${e.protein}g</td>
    <td style="color:#38bdf8">${e.carbs}g</td>
    <td style="color:#c084fc">${e.fat}g</td>
    <td style="font-weight:700;color:${e.kcal<=2300?"#f1f5f9":"#f87171"}">${e.kcal}</td>
    <td><button class="del-btn" data-action="del-mac" data-date="${e.date}">✕</button></td>
  </tr>`).join("");
  const todaySection=todayMac?`<div class="card">
    <div class="card-title">Today's Progress</div>
    ${macroProgressBar("Protein",todayMac.protein,TARGETS.protein,"#a3e635")}
    ${macroProgressBar("Carbs",todayMac.carbs,TARGETS.carbs,"#38bdf8")}
    ${macroProgressBar("Fat",todayMac.fat,TARGETS.fat,"#c084fc")}
    ${macroProgressBar("Calories",todayMac.kcal,TARGETS.kcal,"#f59e0b"," kcal")}
    <div style="margin-top:12px;padding:10px 12px;background:#080e1a;border-radius:8px;font-size:12px;color:#64748b">
      <span style="color:#f1f5f9;font-weight:700">${todayMac.kcal} kcal</span> logged today ·
      <span style="color:${todayMac.protein>=160?"#34d399":"#f59e0b"}">${todayMac.protein>=160?"✓ Protein on track":"⚠ Need "+(180-todayMac.protein)+"g more protein"}</span>
    </div>
  </div>`:"";
  const activeMeal=MEALS.find(m=>m.id===S.selMeal);
  const foodCards=activeMeal?activeMeal.foods.map(food=>`
    <div class="food-card" style="border-left:3px solid ${activeMeal.color}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px">
        <div>
          <div style="font-size:14px;font-weight:700;color:#f1f5f9">${esc(food.name)}</div>
          <div style="font-size:11px;color:#475569;margin-top:2px">${esc(food.portion)}</div>
        </div>
        <div style="background:${activeMeal.color}22;border:1px solid ${activeMeal.color}44;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:800;color:${activeMeal.color};white-space:nowrap;flex-shrink:0">${food.kcal} kcal</div>
      </div>
      <div style="margin-bottom:8px">
        ${[["P",food.p,"#a3e635"],["C",food.c,"#38bdf8"],["F",food.f,"#c084fc"]].map(([l,v,c])=>
          `<span class="macro-pill" style="background:${c}11"><span style="font-size:10px;font-weight:700;color:${c}">${l}</span><span style="font-size:12px;font-weight:700;color:#f1f5f9">${v}g</span></span>`
        ).join("")}
      </div>
      <div style="font-size:11px;color:#64748b;font-style:italic">"${esc(food.note)}"</div>
    </div>`).join(""):"";
  return `
    <div class="card">
      <div class="card-title">Daily Targets — Phase 1</div>
      <div class="target-grid">
        ${[{l:"Calories",v:"2,200",u:"kcal",c:"#f59e0b",s:"~500 deficit"},{l:"Protein",v:"180",u:"g",c:"#a3e635",s:"2.4g/kg"},{l:"Carbs",v:"220",u:"g",c:"#38bdf8",s:"40% total"},{l:"Fat",v:"60",u:"g",c:"#c084fc",s:"25% total"}].map(t=>`
        <div style="background:#080e1a;border:1px solid ${t.c}33;border-top:2px solid ${t.c};border-radius:10px;padding:10px">
          <div style="font-size:8px;color:#64748b;font-weight:700;letter-spacing:.1em;text-transform:uppercase">${t.l}</div>
          <div style="font-size:15px;font-weight:800;color:${t.c};margin-top:2px;line-height:1.1">${t.v}<span style="font-size:9px">${t.u}</span></div>
          <div style="font-size:9px;color:#475569;margin-top:2px">${t.s}</div>
        </div>`).join("")}
      </div>
      <div class="tip-box" style="border-left:2px solid #a3e635"><strong style="color:#a3e635">Rule #1:</strong> Hit 180g protein every single day. Nail protein + stay near 2,200 kcal and everything works.</div>
    </div>
    <div class="card">
      <div class="card-title">Log Daily Macros</div>
      <div class="form-row">
        <div class="fg"><label class="lbl">Date</label><input class="inp" type="date" id="mac-date" value="${S.macDate}"></div>
        <div class="fg" style="max-width:78px"><label class="lbl">Protein (g)</label><input class="inp" type="number" placeholder="180" id="mac-p" value="${esc(S.macP)}"></div>
        <div class="fg" style="max-width:78px"><label class="lbl">Carbs (g)</label><input class="inp" type="number" placeholder="220" id="mac-c" value="${esc(S.macC)}"></div>
        <div class="fg" style="max-width:68px"><label class="lbl">Fat (g)</label><input class="inp" type="number" placeholder="60" id="mac-f" value="${esc(S.macF)}"></div>
        <button class="btn btn-purple" data-action="add-mac">+ Log</button>
      </div>
    </div>
    ${todaySection}
    <div class="card">
      <div class="card-title">Macro Trend (last 10 days)</div>
      ${macroBarChart(chartData)}
    </div>
    ${macData.length>0?`<div class="card">
      <div class="card-title">Macro History</div>
      <table class="tbl"><thead><tr><th>Date</th><th>P</th><th>C</th><th>F</th><th>kcal</th><th></th></tr></thead><tbody>${macRows}</tbody></table>
    </div>`:""}
    <div class="card">
      <div class="card-title">Food Suggestions by Meal</div>
      <div class="chips" style="overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px;margin-bottom:12px">
        ${MEALS.map(m=>`<button class="chip${S.selMeal===m.id?" active":""}" style="${S.selMeal===m.id?`background:${m.color}`:""}" data-action="set-meal" data-meal="${m.id}">${m.emoji} ${m.label}</button>`).join("")}
      </div>
      ${activeMeal?`<div class="tip-box" style="border-left:2px solid ${activeMeal.color}">💡 ${esc(activeMeal.tip)}</div>${foodCards}`:""}
    </div>
    <div style="height:20px"></div>`;
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function render() {
  renderHeader();
  renderTabs();
  const content=S.tab==="bodyweight"?renderBodyWeightTab():S.tab==="lifting"?renderLiftingTab():renderNutritionTab();
  document.getElementById("tab-content").innerHTML=content;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function addBodyWeight() {
  const date=document.getElementById("bw-date")?.value||S.bwDate;
  const val=document.getElementById("bw-val")?.value;
  if(!val||isNaN(parseFloat(val))) return;
  S.bwDate=date; S.bwVal="";
  const w=parseFloat(parseFloat(val).toFixed(1));
  S.bwData=[...S.bwData.filter(e=>e.date!==date),{date,weight:w}].sort((a,b)=>new Date(a.date)-new Date(b.date));
  save("bw_data",S.bwData); showFlash("✓ Weight saved"); render();
}
function delBodyWeight(date) {
  S.bwData=S.bwData.filter(e=>e.date!==date); save("bw_data",S.bwData); render(); renderHeader();
}
function addLift() {
  const date=document.getElementById("lift-date")?.value||S.liftDate;
  const kg=document.getElementById("lift-kg")?.value;
  if(!kg||isNaN(parseFloat(kg))) return;
  S.liftDate=date;
  const sets=document.getElementById("lift-sets")?.value||"–";
  const reps=document.getElementById("lift-reps")?.value||"–";
  S.liftKg=""; S.liftSets=""; S.liftReps="";
  const entry={date,weight:parseFloat(parseFloat(kg).toFixed(1)),sets,reps};
  const prev=S.liftData[S.selEx]||[];
  S.liftData={...S.liftData,[S.selEx]:[...prev.filter(e=>e.date!==date),entry].sort((a,b)=>new Date(a.date)-new Date(b.date))};
  save("lift_data",S.liftData); showFlash("✓ Lift saved"); render();
}
function delLift(date) {
  S.liftData={...S.liftData,[S.selEx]:(S.liftData[S.selEx]||[]).filter(e=>e.date!==date)};
  save("lift_data",S.liftData); render();
}
function addMacro() {
  const date=document.getElementById("mac-date")?.value||S.macDate;
  const p=parseFloat(document.getElementById("mac-p")?.value)||0;
  const c=parseFloat(document.getElementById("mac-c")?.value)||0;
  const f=parseFloat(document.getElementById("mac-f")?.value)||0;
  if(!p&&!c&&!f) return;
  S.macDate=date; S.macP=""; S.macC=""; S.macF="";
  const entry={date,protein:p,carbs:c,fat:f,kcal:Math.round(p*4+c*4+f*9)};
  S.macData=[...S.macData.filter(e=>e.date!==date),entry].sort((a,b)=>new Date(a.date)-new Date(b.date));
  save("mac_data",S.macData); showFlash("✓ Macros saved"); render(); renderHeader();
}
function delMacro(date) {
  S.macData=S.macData.filter(e=>e.date!==date); save("mac_data",S.macData); render(); renderHeader();
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
document.addEventListener("click", e => {
  const el=e.target.closest("[data-action]");
  if(!el) return;
  const a=el.dataset.action;
  if(a==="set-tab"){S.tab=el.dataset.tab; render();}
  else if(a==="add-bw") addBodyWeight();
  else if(a==="del-bw") delBodyWeight(el.dataset.date);
  else if(a==="set-ex"){S.selEx=el.dataset.ex; render();}
  else if(a==="add-lift") addLift();
  else if(a==="del-lift") delLift(el.dataset.date);
  else if(a==="set-meal"){S.selMeal=el.dataset.meal; render();}
  else if(a==="add-mac") addMacro();
  else if(a==="del-mac") delMacro(el.dataset.date);
});

document.addEventListener("keydown", e => {
  if(e.key!=="Enter") return;
  if(e.target.closest("#bw-date,#bw-val")) addBodyWeight();
  if(e.target.id==="lift-kg"||e.target.id==="lift-sets"||e.target.id==="lift-reps") addLift();
  if(e.target.id==="mac-p"||e.target.id==="mac-c"||e.target.id==="mac-f") addMacro();
});

// ── INIT ──────────────────────────────────────────────────────────────────────
(function init() {
  S.bwData=load("bw_data")||[];
  S.liftData=load("lift_data")||{};
  S.macData=load("mac_data")||[];
  render();
})();
</script>
</body>
</html>
